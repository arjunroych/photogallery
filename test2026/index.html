<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Photo Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #17140f;
    --bg-raised: #201c15;
    --paper: #ece5d8;
    --paper-dim: #b8b1a3;
    --safelight: #c1432d;
    --amber: #d9a441;
    --meta: #8a8377;
    --border: #38332a;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse at top, rgba(193, 67, 45, 0.06), transparent 60%);
    color: var(--paper);
    font-family: "IBM Plex Mono", monospace;
    min-height: 100vh;
  }

  header {
    padding: 3.5rem 1.5rem 2rem;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }

  header .eyebrow {
    font-size: 0.7rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--safelight);
    margin: 0 0 0.75rem;
  }

  header h1 {
    font-family: "Oswald", sans-serif;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-size: clamp(2rem, 6vw, 3.2rem);
    margin: 0;
    color: var(--paper);
  }

  header p.sub {
    color: var(--meta);
    font-size: 0.85rem;
    margin: 0.75rem 0 0;
  }

  #roll-count {
    color: var(--amber);
  }

  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 2.5rem 1.5rem 5rem;
  }

  .sheet {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 1.75rem 1.5rem;
  }

  .frame {
    position: relative;
    background: var(--bg-raised);
    border: 1px solid var(--border);
    padding: 10px 10px 0;
    cursor: pointer;
    opacity: 0;
    transform: translateY(10px);
    animation: rise 0.5s ease forwards;
    transition: border-color 0.2s ease, transform 0.2s ease;
  }

  .frame:hover,
  .frame:focus-visible {
    border-color: var(--safelight);
    transform: translateY(-3px);
    outline: none;
  }

  .sprockets {
    display: flex;
    justify-content: space-between;
    padding: 0 2px 8px;
  }

  .sprockets span {
    width: 6px;
    height: 6px;
    background: var(--border);
  }

  .frame:hover .sprockets span,
  .frame:focus-visible .sprockets span {
    background: var(--safelight);
  }

  .frame-photo {
    width: 100%;
    aspect-ratio: 3 / 2;
    object-fit: cover;
    display: block;
    filter: saturate(0.92) contrast(1.03);
    background: #0d0b08;
  }

  .frame-label {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 8px 2px 10px;
    font-size: 0.7rem;
    color: var(--meta);
    gap: 0.5rem;
  }

  .frame-label .num {
    color: var(--amber);
    flex-shrink: 0;
  }

  .frame-label .name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--paper-dim);
  }

  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }

  .empty {
    text-align: center;
    padding: 4rem 1rem;
    color: var(--meta);
    border: 1px dashed var(--border);
  }

  .empty h2 {
    font-family: "Oswald", sans-serif;
    color: var(--paper-dim);
    font-weight: 500;
    letter-spacing: 0.04em;
    margin-bottom: 0.5rem;
  }

  .empty code {
    color: var(--amber);
    background: var(--bg-raised);
    padding: 0.15em 0.4em;
  }

  /* Lightbox */
  #lightbox {
    position: fixed;
    inset: 0;
    background: rgba(10, 9, 6, 0.94);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 2rem;
  }

  #lightbox.open { display: flex; }

  #lightbox img {
    max-width: min(90vw, 1100px);
    max-height: 80vh;
    object-fit: contain;
    border: 1px solid var(--border);
  }

  #lightbox .lb-caption {
    position: absolute;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.75rem;
    color: var(--meta);
    text-align: center;
  }

  #lightbox .lb-caption .num { color: var(--amber); margin-right: 0.5em; }

  #lightbox button {
    position: absolute;
    background: none;
    border: 1px solid var(--border);
    color: var(--paper);
    font-family: "IBM Plex Mono", monospace;
    font-size: 1rem;
    width: 44px;
    height: 44px;
    cursor: pointer;
    transition: border-color 0.2s ease, color 0.2s ease;
  }

  #lightbox button:hover { border-color: var(--safelight); color: var(--safelight); }

  #lb-prev,
  #lb-next {
    border-radius: 50%;
    background: var(--bg-raised);
  }

  #lb-close { top: 1.5rem; right: 1.5rem; }
  #lb-prev { top: 50%; left: 1.5rem; transform: translateY(-50%); }
  #lb-next { top: 50%; right: 1.5rem; transform: translateY(-50%); }

  @media (max-width: 640px) {
    #lb-prev, #lb-next { width: 38px; height: 38px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .frame { animation: none; opacity: 1; transform: none; }
  }
</style>
</head>
<body>

<header>
  <p class="eyebrow">Example photo album &middot; August 2026</p>
  <h1>Test Photo Gallery</h1>
  <p class="sub"><span id="roll-count">—</span> photos in this album</p>
</header>

<main>
  <div class="sheet" id="sheet"></div>
</main>

<div id="lightbox">
  <button id="lb-prev" aria-label="Previous photo">&#8592;</button>
  <img id="lb-img" src="" alt="">
  <button id="lb-next" aria-label="Next photo">&#8594;</button>
  <button id="lb-close" aria-label="Close">&#10005;</button>
  <div class="lb-caption"><span class="num" id="lb-num"></span><span id="lb-title"></span></div>
</div>

<script>
  const sheetEl = document.getElementById("sheet");
  const countEl = document.getElementById("roll-count");
  const lightbox = document.getElementById("lightbox");
  const lbImg = document.getElementById("lb-img");
  const lbTitle = document.getElementById("lb-title");
  const lbNum = document.getElementById("lb-num");

  let photos = [];
  let currentIndex = 0;

  function openLightbox(i) {
    currentIndex = i;
    const p = photos[i];
    lbImg.src = `photos/${p.file}`;
    lbImg.alt = p.title;
    lbTitle.textContent = p.title;
    lbNum.textContent = `#${p.frame}`;
    lightbox.classList.add("open");
  }

  function closeLightbox() {
    lightbox.classList.remove("open");
  }

  function step(delta) {
    currentIndex = (currentIndex + delta + photos.length) % photos.length;
    openLightbox(currentIndex);
  }

  document.getElementById("lb-close").addEventListener("click", closeLightbox);
  document.getElementById("lb-prev").addEventListener("click", () => step(-1));
  document.getElementById("lb-next").addEventListener("click", () => step(1));
  lightbox.addEventListener("click", (e) => { if (e.target === lightbox) closeLightbox(); });

  document.addEventListener("keydown", (e) => {
    if (!lightbox.classList.contains("open")) return;
    if (e.key === "Escape") closeLightbox();
    if (e.key === "ArrowLeft") step(-1);
    if (e.key === "ArrowRight") step(1);
  });

  function render() {
    countEl.textContent = photos.length;

    if (photos.length === 0) {
      sheetEl.innerHTML = `
        <div class="empty" style="grid-column: 1 / -1;">
          <h2>No frames developed yet</h2>
          <p>Drop images into <code>/photos</code> and push — the roll fills in on its own.</p>
        </div>`;
      return;
    }

    sheetEl.innerHTML = photos.map((p, i) => `
      <div class="frame" tabindex="0" role="button" aria-label="Open ${p.title}" data-index="${i}" style="animation-delay: ${Math.min(i * 0.04, 0.6)}s">
        <div class="sprockets">${"<span></span>".repeat(8)}</div>
        <img class="frame-photo" src="photos/${p.file}" alt="${p.title}" loading="lazy">
        <div class="frame-label">
          <span class="num">${p.frame}</span>
          <span class="name">${p.title}</span>
        </div>
      </div>
    `).join("");

    sheetEl.querySelectorAll(".frame").forEach((el) => {
      const open = () => openLightbox(Number(el.dataset.index));
      el.addEventListener("click", open);
      el.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } });
    });
  }

  fetch("photos.json", { cache: "no-store" })
    .then((r) => r.ok ? r.json() : [])
    .then((data) => { photos = data; render(); })
    .catch(() => { photos = []; render(); });
</script>

</body>
</html>
