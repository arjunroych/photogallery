<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>
    // Without a trailing slash, "../assets/..." and "./photos.json" resolve
    // one level too high. Fix the URL before anything else loads.
    if (!location.pathname.endsWith('/')) {
      location.replace(location.pathname + '/' + location.search + location.hash);
    }
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title id="page-title">Album — Photos</title>
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <header class="site-header">
    <a class="home-link" href="../">&larr; All albums</a>
    <h1 id="album-title"></h1>
    <p class="meta" id="photo-count"></p>
  </header>

  <main id="gallery" class="gallery">
    <!-- populated by gallery.js from ./photos.json -->
  </main>

  <script src="../assets/gallery.js"></script>
  <script>
    // Title comes straight from the folder name — rename the folder, the page updates itself.
    var slug = location.pathname.replace(/\/$/, '').split('/').pop();
    var title = slug.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    document.getElementById('album-title').textContent = title;
    document.getElementById('page-title').textContent = title + ' — Photos';

    fetch('./photos.json').then(r => r.json()).then(d => {
      const n = (d.files || []).length;
      document.getElementById('photo-count').textContent = n + (n === 1 ? ' photo' : ' photos');
    }).catch(() => {});
  </script>
</body>
</html>
