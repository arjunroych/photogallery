name: Update photo gallery manifest

on:
  push:
    branches: [main]
    paths:
      - "template/photos/**"
      - "template/scripts/generate-manifest.mjs"

jobs:
  build-manifest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: template
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate photos.json
        run: node scripts/generate-manifest.mjs

      - name: Commit updated manifest
        run: |
          git config user.name "arjunroych"
          git config user.email "arjun.src@gmail.com"
          git add photos.json
          git diff --quiet --cached || git commit -m "Update photo manifest"
          git push
          