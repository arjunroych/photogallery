<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Photo Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <p class="eyebrow">Example photo album &middot; August 2026</p>
  <h1>Photo Gallery Template</h1>
  <p class="sub"><span id="roll-count">—</span> photos in this album</p>
</header>

<main>
  <div class="sheet" id="sheet"></div>
</main>

<div id="lightbox">
  <button id="lb-prev" aria-label="Previous photo">&#8592;</button>
  <img id="lb-img" src="" alt="">
  <button id="lb-next" aria-label="Next photo">&#8594;</button>
  <button id="lb-close" aria-label="Close">&#10005;</button>
  <div class="lb-caption"><span class="num" id="lb-num"></span><span id="lb-title"></span></div>
</div>

<script>
  const sheetEl = document.getElementById("sheet");
  const countEl = document.getElementById("roll-count");
  const lightbox = document.getElementById("lightbox");
  const lbImg = document.getElementById("lb-img");
  const lbTitle = document.getElementById("lb-title");
  const lbNum = document.getElementById("lb-num");

  let photos = [];
  let currentIndex = 0;

  function openLightbox(i) {
    currentIndex = i;
    const p = photos[i];
    lbImg.src = `photos/${p.file}`;
    lbImg.alt = p.title;
    lbTitle.textContent = p.title;
    lbNum.textContent = `#${p.frame}`;
    lightbox.classList.add("open");
  }

  function closeLightbox() {
    lightbox.classList.remove("open");
  }

  function step(delta) {
    currentIndex = (currentIndex + delta + photos.length) % photos.length;
    openLightbox(currentIndex);
  }

  document.getElementById("lb-close").addEventListener("click", closeLightbox);
  document.getElementById("lb-prev").addEventListener("click", () => step(-1));
  document.getElementById("lb-next").addEventListener("click", () => step(1));
  lightbox.addEventListener("click", (e) => { if (e.target === lightbox) closeLightbox(); });

  document.addEventListener("keydown", (e) => {
    if (!lightbox.classList.contains("open")) return;
    if (e.key === "Escape") closeLightbox();
    if (e.key === "ArrowLeft") step(-1);
    if (e.key === "ArrowRight") step(1);
  });

  function render() {
    countEl.textContent = photos.length;

    if (photos.length === 0) {
      sheetEl.innerHTML = `
        <div class="empty" style="grid-column: 1 / -1;">
          <h2>No frames developed yet</h2>
          <p>Drop images into <code>/photos</code> and push — the roll fills in on its own.</p>
        </div>`;
      return;
    }

    sheetEl.innerHTML = photos.map((p, i) => `
      <div class="frame" tabindex="0" role="button" aria-label="Open ${p.title}" data-index="${i}" style="animation-delay: ${Math.min(i * 0.04, 0.6)}s">
        <div class="sprockets">${"<span></span>".repeat(8)}</div>
        <img class="frame-photo" src="photos/${p.file}" alt="${p.title}" loading="lazy">
        <div class="frame-label">
          <span class="num">${p.frame}</span>
          <span class="name">${p.title}</span>
        </div>
      </div>
    `).join("");

    sheetEl.querySelectorAll(".frame").forEach((el) => {
      const open = () => openLightbox(Number(el.dataset.index));
      el.addEventListener("click", open);
      el.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } });
    });
  }

  fetch("photos.json", { cache: "no-store" })
    .then((r) => r.ok ? r.json() : [])
    .then((data) => { photos = data; render(); })
    .catch(() => { photos = []; render(); });
</script>

</body>
</html>
