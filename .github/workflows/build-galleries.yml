name: Build Galleries

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    # Guard against an infinite loop: the commit step below tags its
    # own commits with [skip ci], so this workflow doesn't re-trigger
    # itself.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Generate photo manifests
        run: node scripts/generate-manifests.mjs

      - name: Commit updated manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          find . -name 'photos.json' -exec git add {} +
          if git diff --cached --quiet; then
            echo "No manifest changes."
          else
            git commit -m "Auto-update photo manifests [skip ci]"
            git push
          fi
